name: 빗썸 5일신고가 전체스캔

on:
  schedule:
    - cron: '30 15 * * *'
    - cron: '30 21 * * *'
    - cron: '30 3 * * *'
    - cron: '30 9 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 빗썸 전체 스캔 실행
        env:
          HIGH5_TELEGRAM_BOT_TOKEN: ${{ secrets.HIGH5_TELEGRAM_BOT_TOKEN }}
          HIGH5_TELEGRAM_CHAT_ID: ${{ secrets.HIGH5_TELEGRAM_CHAT_ID }}
        run: python scripts/full_scan_bithumb.py
      - name: 결과 커밋
        run: |
          git config user.name "high5-bot"
          git config user.email "high5-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "빗썸 5일신고가 전체스캔 결과 업데이트"
          git push
