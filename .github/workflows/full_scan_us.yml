name: 미국 5일신고가 전체스캔

# concurrency 그룹으로 data/ 커밋 워크플로우들이 동시에 안 돌게 하고, 커밋 단계에
# pull --rebase 재시도까지 추가해서 "failed to push some refs" 충돌을 방지함.
on:
  schedule:
    - cron: '0 19 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

concurrency:
  group: high5-data-pipeline
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 미국 전체 스캔 실행
        env:
          HIGH5_TELEGRAM_BOT_TOKEN: ${{ secrets.HIGH5_TELEGRAM_BOT_TOKEN }}
          HIGH5_TELEGRAM_CHAT_ID: ${{ secrets.HIGH5_TELEGRAM_CHAT_ID }}
        run: python scripts/full_scan_us.py
      - name: 결과 커밋 (충돌 시 최대 3회 재시도)
        run: |
          git config user.name "high5-bot"
          git config user.email "high5-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경사항 없음, 커밋 생략"
            exit 0
          fi
          git commit -m "미국 5일신고가 전체스캔 결과 업데이트"
          for i in 1 2 3; do
            if git push; then
              echo "push 성공"
              exit 0
            fi
            echo "push 실패, pull --rebase 후 재시도 ($i/3)"
            git pull --rebase origin main
          done
          echo "3회 재시도에도 push 실패"
          exit 1
