name: 관심종목 재확인

# ⚠️ 이전에 GitHub 자체 schedule과 cron-job.org의 workflow_dispatch가 겹쳐서 중복
# 실행되던 문제는 schedule 제거로 해결됨 (workflow_dispatch만 남김).
#
# ⚠️ 신규 문제: data/를 커밋하는 다른 워크플로우(position_check, tracked_check,
# telegram_listener, full_scan_*)와 실행 시점이 겹치면 git push가 서로 충돌해서
# "failed to push some refs (fetch first)" 에러로 실패하는 현상 발생.
# -> concurrency 그룹으로 묶어서 data/ 커밋하는 워크플로우들이 절대 동시에 안 돌고
#    줄 서서 하나씩만 실행되게 함 (push 충돌 원천 차단).
# -> 혹시 모를 경우를 대비해 커밋 단계에도 pull --rebase 후 재시도 안전장치 추가.
on:
  workflow_dispatch:

concurrency:
  group: high5-data-pipeline
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 국내 재확인
        env:
          HIGH5_TELEGRAM_BOT_TOKEN: ${{ secrets.HIGH5_TELEGRAM_BOT_TOKEN }}
          HIGH5_TELEGRAM_CHAT_ID: ${{ secrets.HIGH5_TELEGRAM_CHAT_ID }}
        run: python scripts/recheck_korea.py
      - name: 미국 재확인
        env:
          HIGH5_TELEGRAM_BOT_TOKEN: ${{ secrets.HIGH5_TELEGRAM_BOT_TOKEN }}
          HIGH5_TELEGRAM_CHAT_ID: ${{ secrets.HIGH5_TELEGRAM_CHAT_ID }}
        run: python scripts/recheck_us.py
      - name: 코인 재확인
        env:
          HIGH5_TELEGRAM_BOT_TOKEN: ${{ secrets.HIGH5_TELEGRAM_BOT_TOKEN }}
          HIGH5_TELEGRAM_CHAT_ID: ${{ secrets.HIGH5_TELEGRAM_CHAT_ID }}
        run: python scripts/recheck_bithumb.py
      - name: 결과 커밋 (충돌 시 최대 3회 재시도)
        run: |
          git config user.name "high5-bot"
          git config user.email "high5-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경사항 없음, 커밋 생략"
            exit 0
          fi
          git commit -m "관심종목 재확인 결과 업데이트"
          for i in 1 2 3; do
            if git push; then
              echo "push 성공"
              exit 0
            fi
            echo "push 실패, pull --rebase 후 재시도 ($i/3)"
            git pull --rebase origin main
          done
          echo "3회 재시도에도 push 실패"
          exit 1
