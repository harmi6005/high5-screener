name: telegram_listener

# concurrency 그룹으로 data/ 커밋 워크플로우들이 동시에 안 돌게 함.
# (이 파일은 stefanzweifel/git-auto-commit-action을 쓰므로 별도 pull --rebase
# 재시도 스크립트는 필요 없음 - concurrency로 겹침 자체를 막는 게 핵심 방어선)
on:
  workflow_dispatch:

concurrency:
  group: high5-data-pipeline
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/telegram_listener.py
        env:
          HIGH5_TELEGRAM_BOT_TOKEN: ${{ secrets.HIGH5_TELEGRAM_BOT_TOKEN }}
          HIGH5_TELEGRAM_CHAT_ID: ${{ secrets.HIGH5_TELEGRAM_CHAT_ID }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "telegram listener update"
          file_pattern: "data/*.csv data/telegram_offset.txt"
