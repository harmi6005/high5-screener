name: 텔레그램 웹훅 즉시처리

on:
  repository_dispatch:
    types: [telegram_message]

jobs:
  handle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 웹훅 명령어 즉시 처리
        env:
          HIGH5_TELEGRAM_BOT_TOKEN: ${{ secrets.HIGH5_TELEGRAM_BOT_TOKEN }}
          HIGH5_TELEGRAM_CHAT_ID: ${{ secrets.HIGH5_TELEGRAM_CHAT_ID }}
          COMMAND_TEXT: ${{ github.event.client_payload.text }}
        run: python scripts/webhook_handler.py
      - name: 결과 커밋
        run: |
          git config user.name "high5-bot"
          git config user.email "high5-bot@users.noreply.github.com"
          git add data/positions.csv 2>/dev/null || true
          git add data/tracked.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "웹훅 명령어 처리 결과 업데이트"
          git push
