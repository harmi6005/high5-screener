name: 관심종목 현황요약

# ⚠️ schedule(GitHub 자체 cron) 트리거를 의도적으로 제거함.
# cron-job.org가 5분마다 이 워크플로우의 workflow_dispatch를 GitHub API로 직접 호출하고
# 있는데, 여기에 GitHub 자체 schedule('*/5 * * * *')까지 같이 켜져 있으면 두 트리거가
# 각각 별도로 실행돼서 실질적으로 1~2분 간격처럼 중복 실행되는 문제가 있었음.
# workflow_dispatch만 남겨서 cron-job.org의 5분 호출로만 돌게 함.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 관심종목 5분 현황요약
        env:
          HIGH5_TELEGRAM_BOT_TOKEN: ${{ secrets.HIGH5_TELEGRAM_BOT_TOKEN }}
          HIGH5_TELEGRAM_CHAT_ID: ${{ secrets.HIGH5_TELEGRAM_CHAT_ID }}
        run: python scripts/watchlist_check.py

      - name: 결과 커밋
        run: |
          git config user.name "high5-bot"
          git config user.email "high5-bot@users.noreply.github.com"
          git add data/scan.csv
          git diff --cached --quiet || git commit -m "관심종목 현황 업데이트"
          git push
